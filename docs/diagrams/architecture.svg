<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="940" height="660" fill="#ffffff"/>
  <text x="32" y="38" font-size="19" font-weight="700" fill="#0f172a">Hand Sign Digit Recognition — logical architecture</text>
  <text x="32" y="60" font-size="12.5" fill="#64748b">Single Flask process; the Keras model is loaded once at import and held in memory. No database, no queue, no file storage.</text>

  <!-- CLIENT -->
  <rect x="32" y="190" width="180" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="122" y="218" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Web browser</text>
  <line x1="52" y1="230" x2="192" y2="230" stroke="#cbd5e1"/>
  <text x="122" y="252" font-size="11.5" fill="#475569" text-anchor="middle">Bootstrap 4.3 + jQuery</text>
  <text x="122" y="270" font-size="11.5" fill="#475569" text-anchor="middle">(loaded from CDN)</text>
  <text x="122" y="296" font-size="11.5" fill="#475569" text-anchor="middle">image_upload.js</text>
  <text x="122" y="314" font-size="11" fill="#94a3b8" text-anchor="middle">client-side preview only</text>

  <!-- FLASK CONTAINER -->
  <rect x="282" y="90" width="300" height="470" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="432" y="116" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Flask application — app.py</text>
  <text x="432" y="134" font-size="11" fill="#3b82f6" text-anchor="middle">app = Flask(__name__) · port 9000</text>

  <rect x="302" y="150" width="260" height="56" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="432" y="172" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">GET /  →  main()</text>
  <text x="432" y="191" font-size="11" fill="#64748b" text-anchor="middle">renders index.html</text>

  <rect x="302" y="220" width="260" height="70" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="432" y="242" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">POST /prediction</text>
  <text x="432" y="260" font-size="12" fill="#0f172a" text-anchor="middle">predict_image_file()</text>
  <text x="432" y="278" font-size="11" fill="#64748b" text-anchor="middle">reads request.files['file'].stream</text>

  <rect x="302" y="330" width="260" height="88" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="432" y="352" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">templates/  (Jinja2)</text>
  <text x="432" y="372" font-size="11.5" fill="#475569" text-anchor="middle">layout.html — base</text>
  <text x="432" y="389" font-size="11.5" fill="#475569" text-anchor="middle">index.html — upload form</text>
  <text x="432" y="406" font-size="11.5" fill="#475569" text-anchor="middle">result.html — prediction / error</text>

  <rect x="302" y="434" width="260" height="68" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="432" y="456" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">static/</text>
  <text x="432" y="476" font-size="11.5" fill="#475569" text-anchor="middle">css/custom.css</text>
  <text x="432" y="493" font-size="11.5" fill="#475569" text-anchor="middle">js/image_upload.js</text>

  <!-- MODEL LAYER -->
  <rect x="652" y="150" width="256" height="200" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.8"/>
  <text x="780" y="176" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">ML layer — model.py</text>

  <rect x="672" y="192" width="216" height="68" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="780" y="213" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">preprocess_img()</text>
  <text x="780" y="231" font-size="11" fill="#64748b" text-anchor="middle">open · resize 224×224 · /255.0</text>
  <text x="780" y="248" font-size="11" fill="#64748b" text-anchor="middle">reshape → (1, 224, 224, 3)</text>

  <rect x="672" y="272" width="216" height="62" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="780" y="293" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">predict_result()</text>
  <text x="780" y="311" font-size="11" fill="#64748b" text-anchor="middle">model.predict → np.argmax</text>
  <text x="780" y="327" font-size="11" fill="#64748b" text-anchor="middle">returns one digit 0–9</text>

  <!-- MODEL FILE -->
  <rect x="652" y="408" width="256" height="94" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.8"/>
  <text x="780" y="434" font-size="13.5" font-weight="700" fill="#713f12" text-anchor="middle">digit_model.h5</text>
  <text x="780" y="454" font-size="11.5" fill="#854d0e" text-anchor="middle">Keras 2 HDF5 · 28 MB</text>
  <text x="780" y="471" font-size="11.5" fill="#854d0e" text-anchor="middle">10 output classes</text>
  <text x="780" y="490" font-size="11" fill="#a16207" text-anchor="middle">loaded once at import time</text>

  <!-- ARROWS -->
  <!-- 1 client -> GET / -->
  <path d="M 212 236 L 296 180" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="246" cy="196" r="11" fill="#475569"/>
  <text x="246" y="200" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 2 render back -->
  <path d="M 302 374 L 212 300" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowBack)"/>
  <circle cx="262" cy="330" r="11" fill="#94a3b8"/>
  <text x="262" y="334" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="243" y="362" font-size="10.5" fill="#94a3b8" text-anchor="middle">rendered HTML</text>
  <text x="243" y="377" font-size="10.5" fill="#94a3b8" text-anchor="middle">(index.html, then result.html)</text>

  <!-- 3 client -> POST -->
  <path d="M 212 262 L 296 252" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="252" cy="248" r="11" fill="#475569"/>
  <text x="252" y="252" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="247" y="288" font-size="10.5" fill="#64748b" text-anchor="middle">multipart/form-data</text>

  <!-- 4 POST -> preprocess -->
  <path d="M 562 248 L 666 226" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="614" cy="233" r="11" fill="#475569"/>
  <text x="614" y="237" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 5 preprocess -> predict -->
  <path d="M 780 260 L 780 268" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="620" cy="283" r="11" fill="#7c3aed"/>
  <text x="620" y="287" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <path d="M 631 283 L 668 292" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- 6 predict -> model file -->
  <path d="M 780 334 L 780 404" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="807" cy="370" r="11" fill="#475569"/>
  <text x="807" y="374" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 7 digit returned to the route, then rendered -->
  <path d="M 672 316 L 570 290" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowBack)"/>
  <circle cx="625" cy="306" r="11" fill="#94a3b8"/>
  <text x="625" y="310" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="622" y="332" font-size="10.5" fill="#94a3b8" text-anchor="middle">digit returned</text>

  <!-- LEGEND -->
  <line x1="32" y1="588" x2="908" y2="588" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="614" font-size="11.5" font-weight="700" fill="#0f172a">Request flow</text>
  <text x="140" y="614" font-size="11" fill="#475569">1  GET / — upload form</text>
  <text x="300" y="614" font-size="11" fill="#475569">2  index.html rendered</text>
  <text x="452" y="614" font-size="11" fill="#475569">3  POST /prediction + file</text>
  <text x="630" y="614" font-size="11" fill="#475569">4  stream → preprocess_img</text>
  <text x="140" y="636" font-size="11" fill="#475569">5  array → predict_result</text>
  <text x="300" y="636" font-size="11" fill="#475569">6  inference on loaded model</text>
  <text x="452" y="636" font-size="11" fill="#475569">7  digit → result.html → browser</text>
  <text x="630" y="636" font-size="11" fill="#94a3b8">dashed = response to browser</text>
</svg>
