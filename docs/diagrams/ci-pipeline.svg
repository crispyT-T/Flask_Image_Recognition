<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#0f172a">Continuous integration pipeline</text>
  <text x="32" y="62" font-size="12.5" fill="#64748b">Two gates on the same checks: pre-commit runs them locally before a commit exists, GitHub Actions runs them again on the pushed branch.</text>

  <!-- LOCAL ROW -->
  <rect x="90" y="100" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="136" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Edit code</text>

  <rect x="255" y="100" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="136" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">git commit</text>

  <rect x="420" y="100" width="200" height="60" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="520" y="124" font-size="12.5" font-weight="700" fill="#7c2d12" text-anchor="middle">pre-commit hooks</text>
  <text x="520" y="142" font-size="10.5" fill="#9a3412" text-anchor="middle">whitespace · YAML · large files · pylint</text>

  <rect x="655" y="100" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="136" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">git push</text>

  <path d="M 222 130 L 251 130" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 387 130 L 416 130" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 622 130 L 651 130" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- local gate rejection -->
  <path d="M 520 163 L 520 196 L 158 196 L 158 164" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aRed)"/>
  <text x="340" y="213" font-size="10.5" fill="#dc2626" text-anchor="middle">a hook fails, so the commit is never created</text>

  <!-- CI CONTAINER -->
  <rect x="90" y="240" width="830" height="175" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="505" y="266" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">GitHub Actions on ubuntu-latest · on push and pull_request to main</text>

  <rect x="112" y="290" width="140" height="70" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="182" y="318" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Checkout</text>
  <text x="182" y="337" font-size="10.5" fill="#64748b" text-anchor="middle">actions/checkout@v4</text>

  <rect x="274" y="290" width="140" height="70" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="344" y="313" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Set up Python</text>
  <text x="344" y="331" font-size="10.5" fill="#64748b" text-anchor="middle">3.11</text>
  <text x="344" y="347" font-size="10.5" fill="#64748b" text-anchor="middle">pip cache</text>

  <rect x="436" y="290" width="140" height="70" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="506" y="313" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Install deps</text>
  <text x="506" y="331" font-size="10.5" fill="#64748b" text-anchor="middle">requirements.txt</text>
  <text x="506" y="347" font-size="10.5" fill="#64748b" text-anchor="middle">requirements-dev.txt</text>

  <rect x="598" y="290" width="140" height="70" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="668" y="318" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Run Pylint</text>
  <text x="668" y="337" font-size="10.5" fill="#64748b" text-anchor="middle">fails under 9.0</text>

  <rect x="760" y="290" width="140" height="70" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="830" y="318" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Run pytest</text>
  <text x="830" y="337" font-size="10.5" fill="#64748b" text-anchor="middle">19 tests</text>

  <path d="M 254 325 L 270 325" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 416 325 L 432 325" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 578 325 L 594 325" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 740 325 L 756 325" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- push into CI -->
  <path d="M 720 163 L 720 236" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- OUTCOMES -->
  <rect x="470" y="450" width="180" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="560" y="475" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">CI fails</text>
  <text x="560" y="494" font-size="10.5" fill="#b91c1c" text-anchor="middle">workflow marked red</text>

  <rect x="700" y="450" width="180" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="790" y="475" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">CI passes</text>
  <text x="790" y="494" font-size="10.5" fill="#15803d" text-anchor="middle">workflow marked green</text>

  <path d="M 830 362 L 830 428" fill="none" stroke="#475569" stroke-width="1.8"/>
  <path d="M 830 428 L 792 446" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 830 428 L 562 446" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="878" y="424" font-size="10.5" fill="#15803d" text-anchor="middle">all steps green</text>
  <text x="664" y="424" font-size="10.5" fill="#b91c1c" text-anchor="middle">any step non-zero</text>

  <!-- feedback loop -->
  <path d="M 466 479 L 55 479 L 55 130 L 86 130" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
  <text x="250" y="498" font-size="10.5" fill="#dc2626" text-anchor="middle">read the log, fix the cause, commit and push again</text>
</svg>
